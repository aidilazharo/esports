<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <title>Page Not Found | Metadata eSports</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f7fa;
            color: #212529;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .error-card {
            width: 100%;
            max-width: 620px;
            background: #fff;
            border: 1px solid #e6e9ee;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.07);
            padding: 44px 32px;
            text-align: center;
        }

        .logo {
            display: block;
            width: auto;
            height: 58px;
            max-width: 220px;
            margin: 0 auto 30px;
            object-fit: contain;
        }

        .code {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            background: #e7f1ff;
            color: #0d6efd;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .08em;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 6vw, 46px);
            line-height: 1.1;
        }

        p {
            max-width: 470px;
            margin: 0 auto 30px;
            color: #6c757d;
            line-height: 1.65;
            font-size: 16px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 9px;
            font-weight: 600;
            text-decoration: none;
            transition: transform .15s ease, opacity .15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: .92;
        }

        .btn-home {
            background: #0d6efd;
            color: #fff;
        }

        .btn-whatsapp {
            background: #198754;
            color: #fff;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 34px 20px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
