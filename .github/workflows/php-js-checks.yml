name: PHP and JS registration checks

on:
  pull_request:
  push:
    branches:
      - main
      - fix/public-navigation-404

permissions:
  contents: read

jobs:
  syntax-and-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Lint all PHP files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: |
          find assets/js api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify public navigation routes
        run: php tests/public_navigation_test.php
      - name: Verify multilingual portal selector and translations
        run: php tests/portal_language_test.php
      - name: Test directory JSON snapshots and scoped search
        run: php tests/directory_snapshot_test.php
      - name: Test nationwide school import and email-suppression safeguards
        run: php tests/school_directory_import_test.php
      - name: Check Johor school SQL import coverage and email safeguards
        run: php tests/johor_school_sql_test.php
      - name: Check email code verification
        run: php tests/email_verification_test.php
      - name: Prohibit registration SMS transport
        run: |
          if grep -R -nE 'transactionalSMS/send|BREVO_SMS_SENDER|registrationSendSmsCode|sendBrevoSmsVerification|registrationRequestSmsCodeWithEmailFallback' --include='*.php' .; then
            echo 'Registration SMS transport unexpectedly remains' >&2
            exit 1
          fi
